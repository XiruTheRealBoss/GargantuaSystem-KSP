// Science results for the Gargantua System bodies, with nods to the film. Keys: <Body><Situation>[Biome].
// Texts are in Configs/Localization/Localization.cfg (#LOC_GargSys_Sci_*).
@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:FOR[GargantuaSystem]
{
	@RESULTS
	{
		GargantuaInSpaceHigh = #LOC_GargSys_Sci_Gargantua_Crew
		GargantuaInSpaceLow = #LOC_GargSys_Sci_Gargantua_CrewLow
		MillerSrfSplashed = #LOC_GargSys_Sci_Miller_CrewSplashed
		MillerSrfLanded = #LOC_GargSys_Sci_Miller_CrewSplashed
		MillerFlyingLow = #LOC_GargSys_Sci_Miller_CrewFlying
		MillerInSpaceLow = #LOC_GargSys_Sci_Miller_CrewSpace
		MannSrfLanded = #LOC_GargSys_Sci_Mann_CrewLanded
		MannInSpaceLow = #LOC_GargSys_Sci_Mann_CrewSpace
		EdmundsSrfLanded = #LOC_GargSys_Sci_Edmunds_CrewLanded
		EdmundsInSpaceLow = #LOC_GargSys_Sci_Edmunds_CrewSpace
		GargantuaNeutronStarInSpaceLow = #LOC_GargSys_Sci_Pulsar_Crew
		PantagruelInSpaceLow = #LOC_GargSys_Sci_Pantagruel_Crew
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:FOR[GargantuaSystem]
{
	@RESULTS
	{
		GargantuaInSpaceLow = #LOC_GargSys_Sci_Gargantua_Eva
		MillerSrfSplashed = #LOC_GargSys_Sci_Miller_Eva
		MillerSrfLanded = #LOC_GargSys_Sci_Miller_Eva
		MannSrfLanded = #LOC_GargSys_Sci_Mann_Eva
		EdmundsSrfLanded = #LOC_GargSys_Sci_Edmunds_Eva
		GargantuaNeutronStarInSpaceLow = #LOC_GargSys_Sci_Pulsar_Eva
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]:FOR[GargantuaSystem]
{
	@RESULTS
	{
		MillerSrfSplashed = #LOC_GargSys_Sci_Miller_Sample
		MillerSrfLanded = #LOC_GargSys_Sci_Miller_Sample
		MannSrfLanded = #LOC_GargSys_Sci_Mann_Sample
		EdmundsSrfLanded = #LOC_GargSys_Sci_Edmunds_Sample
	}
}
