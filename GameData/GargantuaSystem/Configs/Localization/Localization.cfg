Localization
{
	en-us
	{
		#LOC_GargSys_Gargantua_name = Gargantua
		#LOC_GargSys_Gargantua_desc = A rapidly spinning supermassive black hole, wrapped in a thin, blazing accretion disk. Its light bends around the event horizon, so you can see the far side of the disk arching over the top. Scientists say that surviving there is not possible, but Kerbals say that it's necessary.

		#LOC_GargSys_Miller_name = Miller
		#LOC_GargSys_Miller_desc = A tidally locked ocean world skimming Gargantua's disk. The water is barely knee-deep, which sounds relaxing until you notice the kilometre-high tidal waves on the horizon. Every hour spent down here feels like a very, very long time back home.
		#LOC_GargSys_Mann_name = Mann
		#LOC_GargSys_Mann_desc = A grey-white glacier world of crumpled ice, deep crevasses, streaks of dark volcanic ash and clouds so cold they seem to hang solid in the sky. The original surveyor called it promising; he may have been optimistic.
		#LOC_GargSys_Edmunds_name = Edmunds
		#LOC_GargSys_Edmunds_desc = A dry world of boulder-strewn gravel plains and jagged mountain ranges, with pale salt flats and small dune fields, warmed by the steady light of Pantagruel. The air is thin but breathable, and it might be the best place in this system to call home.
		#LOC_GargSys_Pantagruel_name = Pantagruel
		#LOC_GargSys_Pantagruel_desc = A calm orange star orbiting far out from Gargantua. After the black hole, its ordinary sunlight feels almost homely.
		#LOC_GargSys_NeutronStar_name = Neutron Star
		#LOC_GargSys_NeutronStar_desc = The collapsed core of a long-dead star, twenty kilometres across and heavier than Kerbol. Its gravity is extreme and its radiation is worse. Look, take readings, and do not touch.

		#LOC_GargSys_Biome_Shallows = Shallows
		#LOC_GargSys_Biome_PolarShallows = Polar Shallows
		#LOC_GargSys_Biome_IcePlains = Ice Plains
		#LOC_GargSys_Biome_PressureRidges = Pressure Ridges
		#LOC_GargSys_Biome_CrevasseFields = Crevasse Fields
		#LOC_GargSys_Biome_FrozenHighlands = Frozen Highlands
		#LOC_GargSys_Biome_Poles = Poles
		#LOC_GargSys_Biome_RockyPlains = Rocky Plains
		#LOC_GargSys_Biome_Mountains = Mountains
		#LOC_GargSys_Biome_SaltFlats = Salt Flats
		#LOC_GargSys_Biome_DuneFields = Dune Fields
		#LOC_GargSys_Biome_Canyons = Canyons
		#LOC_GargSys_WormholeA_name = Wormhole (Kerbol side)
		#LOC_GargSys_WormholeB_name = Wormhole (Gargantua side)
		#LOC_GargSys_Wormhole_desc = A sphere-shaped hole in space. Look into it and you see another galaxy, bent around its edge. Fly in slowly, keep your nose pointed at the middle, and trust whoever put it here.
		#LOC_GargSys_Biome_Throat = Throat
		#LOC_GargSys_WormholeExit = TARS, set humour to 75%
		#LOC_GargSys_WaveWarning = Those aren't mountains... they're waves!
		#LOC_GargSys_Sci_Gargantua_Crew = The crew stares at the disk in silence. Someone finally whispers: "We're not meant to save the world. We're meant to leave it."
		#LOC_GargSys_Sci_Gargantua_CrewLow = The clocks on board disagree with the ones back home, and nobody wants to do the maths.
		#LOC_GargSys_Sci_Gargantua_Eva = Out here the light itself bends around you. Your helmet camera footage will need a lot of explaining.
		#LOC_GargSys_Sci_Miller_CrewSplashed = Knee-deep water as far as the eye can see. One of the crew keeps staring at the horizon: "Those aren't mountains..."
		#LOC_GargSys_Sci_Miller_CrewFlying = From up here the 'mountains' on the horizon are moving. Toward you.
		#LOC_GargSys_Sci_Miller_CrewSpace = Every hour down there is about seven years back home. The mission planner has gone very quiet.
		#LOC_GargSys_Sci_Miller_Eva = You wade through the shallows. Somewhere, a very long countdown has already started.
		#LOC_GargSys_Sci_Miller_Sample = Water, sediment and a nagging feeling that this little manoeuvre is going to cost you decades.
		#LOC_GargSys_Sci_Mann_CrewLanded = Frozen clouds hang overhead like a ceiling of glass. The first survey called this place promising.
		#LOC_GargSys_Sci_Mann_CrewSpace = The beacon still says the planet is habitable. The ice says otherwise.
		#LOC_GargSys_Sci_Mann_Eva = Do not go gentle into that good night. Also, do not take your helmet off.
		#LOC_GargSys_Sci_Mann_Sample = Ice, ammonia and grey volcanic ash. Definitely not the promising world the reports described.
		#LOC_GargSys_Sci_Edmunds_CrewLanded = Dry rock, thin breathable air and a calm orange sun. For the first time in a long time, it feels like home.
		#LOC_GargSys_Sci_Edmunds_CrewSpace = From orbit Edmunds looks quiet and patient, as if it has been waiting for someone.
		#LOC_GargSys_Sci_Edmunds_Eva = Mankind was born on Earth. Kerbalkind, it turns out, was born to keep going.
		#LOC_GargSys_Sci_Edmunds_Sample = Gravel, salt crusts and traces of water deep below. Plan B might actually work.
		#LOC_GargSys_Sci_Pulsar_Crew = The radiation alarm and the pulsar beat in perfect rhythm. Nobody finds it soothing.
		#LOC_GargSys_Sci_Pulsar_Eva = You are floating next to a city-sized star that spins twice a minute. This is fine.
		#LOC_GargSys_Sci_Pantagruel_Crew = After Gargantua, an ordinary orange star feels almost like a hug.
		#LOC_GargSys_TimeDilation = Time dilation: <<1>> passed in the rest of the universe while you were near Miller.
	}
	pt-br
	{
		#LOC_GargSys_Gargantua_name = Gargantua
		#LOC_GargSys_Gargantua_desc = Um buraco negro supermassivo girando quase no limite, envolto num disco de acreção fino e incandescente. A luz contorna o horizonte de eventos, e o lado de trás do disco aparece em arco por cima dele. Os cientistas dizem que sobreviver nele é impossível, mas os Kerbals dizem que é necessário.

		#LOC_GargSys_Miller_name = Miller
		#LOC_GargSys_Miller_desc = Um mundo oceânico em maré travada, raspando o disco de Gargantua. A água mal passa do joelho, o que parece tranquilo até você reparar nas ondas de maré de um quilômetro de altura no horizonte. Cada hora aqui embaixo parece muito, muito tempo lá em casa.
		#LOC_GargSys_Mann_name = Mann
		#LOC_GargSys_Mann_desc = Um mundo-geleira cinza-esbranquiçado de gelo enrugado, fendas profundas, veios de cinza vulcânica escura e nuvens tão frias que parecem penduradas, sólidas, no céu. O pesquisador original o chamou de promissor, acho que ele talvez tenha sido otimista.
		#LOC_GargSys_Edmunds_name = Edmunds
		#LOC_GargSys_Edmunds_desc = Um mundo seco de planícies de cascalho cheias de matacões e cordilheiras serrilhadas, com salinas claras e pequenos campos de dunas, aquecido pela luz constante de Pantagruel. O ar é rarefeito, mas respirável, e este pode ser o melhor lugar do sistema para chamar de lar.
		#LOC_GargSys_Pantagruel_name = Pantagruel
		#LOC_GargSys_Pantagruel_desc = Uma estrela laranja e tranquila, orbitando longe de Gargantua. Depois do buraco negro, a luz comum dela parece quase caseira.
		#LOC_GargSys_NeutronStar_name = Estrela de nêutrons
		#LOC_GargSys_NeutronStar_desc = O núcleo colapsado de uma estrela morta há muito tempo: vinte quilômetros de diâmetro e mais pesado que o Kerbol. A gravidade é extrema e a radiação é pior. Olhe, colete dados e não toque.

		#LOC_GargSys_Biome_Shallows = Águas rasas
		#LOC_GargSys_Biome_PolarShallows = Águas rasas polares
		#LOC_GargSys_Biome_IcePlains = Planícies de gelo
		#LOC_GargSys_Biome_PressureRidges = Cristas de pressão
		#LOC_GargSys_Biome_CrevasseFields = Campos de fendas
		#LOC_GargSys_Biome_FrozenHighlands = Planaltos congelados
		#LOC_GargSys_Biome_Poles = Polos
		#LOC_GargSys_Biome_RockyPlains = Planícies rochosas
		#LOC_GargSys_Biome_Mountains = Montanhas
		#LOC_GargSys_Biome_SaltFlats = Salinas
		#LOC_GargSys_Biome_DuneFields = Campos de dunas
		#LOC_GargSys_Biome_Canyons = Cânions
		#LOC_GargSys_WormholeA_name = Wormhole (lado do Kerbol)
		#LOC_GargSys_WormholeB_name = Wormhole (lado de Gargantua)
		#LOC_GargSys_Wormhole_desc = Um buraco esférico no espaço. Olhe para dentro e você vê outra galáxia, curvada em volta da borda. Entre devagar, mantenha o nariz apontado para o centro e confie em quem colocou isso aqui.
		#LOC_GargSys_Biome_Throat = Garganta
		#LOC_GargSys_WormholeExit = TARS, ajuste o humor para 75%
		#LOC_GargSys_WaveWarning = Não são montanhas... são ondas!
		#LOC_GargSys_Sci_Gargantua_Crew = A tripulação encara o disco em silêncio. Alguém finalmente sussurra: "Não fomos feitos para salvar o mundo. Fomos feitos para deixá-lo."
		#LOC_GargSys_Sci_Gargantua_CrewLow = Os relógios de bordo não concordam com os de casa, e ninguém quer fazer as contas.
		#LOC_GargSys_Sci_Gargantua_Eva = Aqui fora até a luz se curva à sua volta. As imagens da câmera do capacete vão precisar de muita explicação.
		#LOC_GargSys_Sci_Miller_CrewSplashed = Água na altura do joelho até onde a vista alcança. Um tripulante não para de olhar o horizonte: "Aquilo não são montanhas..."
		#LOC_GargSys_Sci_Miller_CrewFlying = Daqui de cima, as 'montanhas' no horizonte estão se mexendo. Na sua direção.
		#LOC_GargSys_Sci_Miller_CrewSpace = Cada hora lá embaixo são uns sete anos em casa. O planejador da missão ficou muito quieto.
		#LOC_GargSys_Sci_Miller_Eva = Você atravessa a água rasa. Em algum lugar, uma contagem regressiva muito longa já começou.
		#LOC_GargSys_Sci_Miller_Sample = Água, sedimento e a sensação incômoda de que essa manobrinha vai custar décadas.
		#LOC_GargSys_Sci_Mann_CrewLanded = Nuvens congeladas pairam acima como um teto de vidro. O primeiro relatório chamou este lugar de promissor.
		#LOC_GargSys_Sci_Mann_CrewSpace = O sinalizador ainda diz que o planeta é habitável. O gelo discorda.
		#LOC_GargSys_Sci_Mann_Eva = Não entre gentilmente nessa boa noite. E também não tire o capacete.
		#LOC_GargSys_Sci_Mann_Sample = Gelo, amônia e cinza vulcânica. Definitivamente não é o mundo promissor dos relatórios.
		#LOC_GargSys_Sci_Edmunds_CrewLanded = Rocha seca, ar rarefeito mas respirável e um sol laranja e calmo. Pela primeira vez em muito tempo, parece um lar.
		#LOC_GargSys_Sci_Edmunds_CrewSpace = Vista da órbita, Edmunds parece calma e paciente, como se estivesse esperando alguém.
		#LOC_GargSys_Sci_Edmunds_Eva = A humanidade nasceu na Terra. Os Kerbals, pelo jeito, nasceram para seguir em frente.
		#LOC_GargSys_Sci_Edmunds_Sample = Cascalho, crostas de sal e traços de água lá no fundo. O Plano B pode dar certo.
		#LOC_GargSys_Sci_Pulsar_Crew = O alarme de radiação e a pulsar batem no mesmo ritmo. Ninguém acha isso relaxante.
		#LOC_GargSys_Sci_Pulsar_Eva = Você está flutuando ao lado de uma estrela do tamanho de uma cidade que gira duas vezes por minuto. Tudo bem.
		#LOC_GargSys_Sci_Pantagruel_Crew = Depois de Gargantua, uma estrela laranja comum parece quase um abraço.
		#LOC_GargSys_TimeDilation = Dilatação temporal: <<1>> se passaram no resto do universo enquanto você estava perto de Miller.
	}
}
