// Real Scale (GargantuaSystemSettings/RealScale = True, forced with RSS/KSRSS): the Gargantua system 10x bigger,
// like RSS does to the Kerbol system.
//   - planet and star radii x10, orbits x10; surface gravity stays the same, so planet masses grow x100 by themselves;
//   - Gargantua, Pantagruel and the pulsar mass x100 (orbital speeds grow ~3x, like RSS);
//   - light curves stretched to the new distances.
// NOT scaled: Gargantua's horizon and accretion disk. Singularity breaks with disks above ~3E10 m
// (LGhassen/Singularity#3), so they keep their size and Miller now orbits outside the disk.

// RSS/KSRSS turn it on (FIRST: before the settings are copied into the root nodes)
@GargantuaSystemSettings:NEEDS[RealSolarSystem|KSRSS]:FIRST
{
	@RealScale = True
}

@Kopernicus:HAS[@GargantuaSystemSettings:HAS[#RealScale[True]]]:AFTER[GargantuaSystem]
{
	@Body[Miller|Mann|Edmunds]
	{
		@Properties { @radius *= 10 }
		@Orbit { @semiMajorAxis *= 10 }
	}
	@Body[GargSysWormholeB]
	{
		@Orbit { @semiMajorAxis *= 10 }
	}
	@Body[GargantuaNeutronStar]
	{
		@Properties { @mass *= 100 }
		@Orbit { @semiMajorAxis *= 10 }
	}
	@Body[Gargantua]
	{
		@Properties
		{
			@mass *= 100
			@sphereOfInfluence *= 10
		}
		@ScaledVersion
		{
			@Light
			{
				@sunAU *= 10
				!IntensityCurve {}
				!ScaledIntensityCurve {}
				!IVAIntensityCurve {}
				IntensityCurve
				{
					key = 0 1.6
					key = 1.5E11 1
					key = 6.0E11 0.5
					key = 3.0E12 0.1
					key = 1.0E13 0
				}
				ScaledIntensityCurve
				{
					key = 0 1.6
					key = 2.5E7 1
					key = 1.0E8 0.5
					key = 5.0E8 0.1
					key = 1.67E9 0
				}
				IVAIntensityCurve
				{
					key = 0 1.6
					key = 1.5E11 1
					key = 6.0E11 0.5
					key = 3.0E12 0.1
					key = 1.0E13 0
				}
			}
		}
	}
	@Body[Pantagruel]
	{
		@Properties
		{
			@radius *= 10
			@mass *= 100
		}
		@Orbit { @semiMajorAxis *= 10 }
		@ScaledVersion
		{
			@Light
			{
				@sunAU *= 10
				!IntensityCurve {}
				!ScaledIntensityCurve {}
				!IVAIntensityCurve {}
				IntensityCurve
				{
					key = 0 1.4
					key = 1.4E11 1
					key = 6.0E11 0.4
					key = 2.0E12 0.08
					key = 4.0E12 0
				}
				ScaledIntensityCurve
				{
					key = 0 1.4
					key = 2.333E7 1
					key = 1.0E8 0.4
					key = 3.333E8 0.08
					key = 6.667E8 0
				}
				IVAIntensityCurve
				{
					key = 0 1.4
					key = 1.4E11 1
					key = 6.0E11 0.4
					key = 2.0E12 0.08
					key = 4.0E12 0
				}
			}
		}
	}
}
