// Real Solar System / KSRSS.
// RSS deletes from Kopernicus every body it does not know. The technique (the same as Kcalbeloh's) is to rename
// our bodies' node type to "DontDeleteMe" before RSS and back to "Body" afterwards.
@Kopernicus:BEFORE[RealSolarSystem]:NEEDS[RealSolarSystem]
{
	@Body:HAS[#identifier[GargantuaSystem/*]]
	{
		|_ = DontDeleteMe
	}
}
@Kopernicus:AFTER[RealSolarSystem]:NEEDS[RealSolarSystem]
{
	@DontDeleteMe,*
	{
		|_ = Body
	}
}

// Sun-side wormhole: near Saturn, like the film (outside the rings and Titan)
@Kopernicus:AFTER[GargantuaSystem]:NEEDS[RealSolarSystem|KSRSS]
{
	@Body[GargSysWormholeA]
	{
		@Orbit
		{
			@referenceBody = Saturn
			@semiMajorAxis = 3.0E9
			@inclination = 5
		}
	}
}

// 10x larger systems: moving Gargantua away by the same ratio keeps the "neighbouring system" outside the heliosphere.
// The Gargantua system itself is scaled 10x by Settings/RealScale.cfg, which RSS/KSRSS turn on.
// That also makes Gargantua 100x heavier (~1E32 kg), enough to stay much heavier than RSS's Sun with DistanceFactor 0.
@Kopernicus:AFTER[GargantuaSystem]:NEEDS[RealSolarSystem]:HAS[@GargantuaSystemSettings:HAS[~DistanceFactor[0]]]
{
	@Body[Gargantua]
	{
		@Orbit
		{
			@semiMajorAxis *= 10
		}
	}
}
