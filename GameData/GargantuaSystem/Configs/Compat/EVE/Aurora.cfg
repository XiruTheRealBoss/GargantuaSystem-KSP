// Mann's aurora: the pulsar's wind hitting the thin atmosphere (creative liberty). A self-lit 2D EVE layer, like
// Cosmic Serenity's auroras; it works with both 2D and raymarched EVE. Texture from tools/gen_clouds.py (colour baked in).
EVE_CLOUDS:NEEDS[EnvironmentalVisualEnhancements]
{
	OBJECT
	{
		name = GargSys-Mann-aurora
		body = Mann
		altitude = 40000
		speed = 0,6,0
		offset = 0,120,0
		settings
		{
			_Color = 255,255,255,255
			_UVNoiseScale = 0.1
			_UVNoiseStrength = 0.001
			_DetailDist = 2E-06
			_MainTex = GargantuaSystem/Textures/EVE/Mann_aurora
		}
		layer2D
		{
			macroCloudMaterial
			{
				// > 1: glows on the night side instead of being lit by Gargantua
				_MinLight = 1.1
				_RimDist = 0.1
			}
		}
	}
}
