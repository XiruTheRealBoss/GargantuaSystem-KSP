// Scatterer replaces stock sun flares, so Pantagruel and the pulsar get their own: copies of Scatterer's stock Sun
// flare (its textures, not shipped here) recoloured. Runs before KerbolAroundGargantua.cfg renames the Sun node (LAST).
@Scatterer_sunflare:HAS[@Sun]:NEEDS[Scatterer]:FOR[GargantuaSystem]
{
	+Sun
	{
		|_ = Pantagruel
		@flareColor = 1.0,0.72,0.45
	}
	+Sun
	{
		|_ = GargantuaNeutronStar
		@flareColor = 0.6,0.75,1.0
		!ghosts {}
	}
}
